name: metallib AIR check

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: IPSW 地址
        default: https://updates.cdn-apple.com/2026FallFCS/5130b3f9-3b4e-469a-b60e-93f6b310cdd9/iPhone17,3_27.0_24A437_Restore.ipsw
      device:
        description: 机型
        default: iPhone17,3
      image:
        description: 镜像（sys = OS cryptex，约 2.2 GiB；fs = 主文件系统，约 8.3 GiB，可能超出 runner 磁盘）
        default: sys

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IPSW_VERSION: 3.1.737
      IPSW_SHA256: 7ac425f5ad069c8582760b514805402c964d0224fda905dd983dc35e4fea4137
      SEVENZIP_TAG: '26.04'
      SEVENZIP_SHA256: fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd
      ZBITMAP_COMMIT: 574abeae25b25c3319b9b6a9225cc7464e08ae88
      ZBITMAP_C_SHA256: 52c2d9ad8ffd821d08ac65fc33d65b6ea848fe90e02e73e6a9dbc81c23ed826f
      ZBITMAP_H_SHA256: a215cdcde2255ea551d15d69db0e301667d0fce659d3da73861f0cf255e9613b
      IPSW_URL: ${{ inputs.ipsw_url }}
      DEVICE: ${{ inputs.device }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ipsw.tgz" \
            "https://github.com/blacktop/ipsw/releases/download/v${IPSW_VERSION}/ipsw_${IPSW_VERSION}_linux_x86_64.tar.gz"
          echo "${IPSW_SHA256}  $RUNNER_TEMP/ipsw.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ipsw"
          tar -xzf "$RUNNER_TEMP/ipsw.tgz" -C "$RUNNER_TEMP/ipsw"
          bin=$(find "$RUNNER_TEMP/ipsw" -type f -name ipsw -perm -u+x | head -n1)
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" version

      # Ubuntu's 7-Zip is too old to read APFS; use the upstream release.
      - name: Install 7-Zip
        run: |
          curl -fsSL -o "$RUNNER_TEMP/7z.tar.xz" \
            "https://github.com/ip7z/7zip/releases/download/${SEVENZIP_TAG}/7z${SEVENZIP_TAG//./}-linux-x64.tar.xz"
          echo "${SEVENZIP_SHA256}  $RUNNER_TEMP/7z.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/7z"
          tar -xJf "$RUNNER_TEMP/7z.tar.xz" -C "$RUNNER_TEMP/7z"
          echo "$RUNNER_TEMP/7z" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/7z/7zz" | head -n 3

      # System libraries are stored with APFS LZBITMAP compression, which 7-Zip cannot decode.
      - name: Build libzbitmap
        run: |
          base="https://raw.githubusercontent.com/eafer/libzbitmap/${ZBITMAP_COMMIT}"
          mkdir -p "$RUNNER_TEMP/zbm"
          curl -fsSL -o "$RUNNER_TEMP/zbm/libzbitmap.c" "$base/libzbitmap.c"
          curl -fsSL -o "$RUNNER_TEMP/zbm/libzbitmap.h" "$base/libzbitmap.h"
          printf '%s  %s\n' "$ZBITMAP_C_SHA256" "$RUNNER_TEMP/zbm/libzbitmap.c" \
            "$ZBITMAP_H_SHA256" "$RUNNER_TEMP/zbm/libzbitmap.h" | sha256sum -c -
          gcc -O2 -shared -fPIC -o "$RUNNER_TEMP/zbm/libzbitmap.so" "$RUNNER_TEMP/zbm/libzbitmap.c"
          echo "ZBITMAP=$RUNNER_TEMP/zbm/libzbitmap.so" >> "$GITHUB_ENV"

      - name: Fetch and decrypt image
        run: |
          mkdir -p work/img
          ipsw extract --remote --device "$DEVICE" --dmg "$IMAGE" --flat \
            --output work/img --json "$IPSW_URL" > work/img/extracted.json
          cat work/img/extracted.json
          archive=$(python3 -c "import json; print(json.load(open('work/img/extracted.json'))[0])")
          if [[ "$archive" == *.aea ]]; then
            # The decrypted image lands directly in --output, not beside the .aea.
            ipsw fw aea --output work/img "$archive"
            rm -f "$archive"
            archive=work/img/$(basename "${archive%.aea}")
          fi
          [ -s "$archive" ] || { echo "decrypted image not found: $archive"; exit 1; }
          ls -l work/img
          echo "DMG=$archive" >> "$GITHUB_ENV"

      - name: Extract metallibs
        run: |
          python3 tools/extract_apfs_files.py "$DMG" work/files --pattern '\.metallib' \
            --sevenzip 7zz --zbitmap "$ZBITMAP"
          rm -f "$DMG"
          mkdir -p out
          cp work/files/.manifest.json out/files.json
          (cd work/files && find . -type f ! -name '.*' -printf '%s\t%p\n' | sort -k2) > out/files.tsv
          cat out/files.tsv

      - name: Analyse
        run: python3 tools/metallib_info.py work/files --out out/metallibs

      - name: Job summary
        if: always()
        run: |
          if [ -f out/metallibs.md ]; then
            head -c 1000000 out/metallibs.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有生成报告，请查看各步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reports only: names, versions and counts. No Apple binaries are uploaded.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metallib-report
          path: out/
          if-no-files-found: warn
